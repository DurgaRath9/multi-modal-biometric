defaults:
  - data: default
  - model: default
  - _self_

seed: 42

training:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  device: "auto"  # auto | cpu | cuda
  checkpoint_dir: "checkpoints"
  early_stopping_patience: 7  # 0 = disabled
  use_amp: true  # Mixed precision (GPU only)
  use_ray: false  # Parallel preflight image validation via Ray
log_dir: "runs"  # TensorBoard log directory
