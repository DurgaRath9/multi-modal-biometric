[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "multi-modal-biometric"
version = "0.1.0"
description = "Scalable Multimodal Biometric Recognition Pipeline — Iris + Fingerprint"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "Pillow>=10.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "structlog>=23.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "tensorboard>=2.14",
    "tqdm>=4.65",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ray = ["ray>=2.9; sys_platform != 'win32'"]
kaggle = ["kagglehub>=0.3"]
demo = ["gradio>=4.0"]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=24.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
